<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hive Console — Organizer</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: #08080a; }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  .hive-fade { opacity: 1; animation: hiveFade 280ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  @keyframes hiveFade { from { transform: translateY(5px); } to { transform: none; } }
  .hive-pop { opacity: 1; animation: hivePop 220ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  @keyframes hivePop { from { transform: scale(0.97); } to { transform: none; } }
  @keyframes scan-line { 0% { top: 24px; } 100% { top: calc(100% - 24px); } }
  @media (prefers-reduced-motion: reduce) { .hive-fade, .hive-pop { animation: none; } [style*="scan-line"] { animation: none !important; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="console-data.js"></script>
  <script type="text/babel" src="browser-window.jsx"></script>
  <script type="text/babel" src="console-ui.jsx"></script>
  <script type="text/babel" src="console-screens.jsx"></script>
  <script type="text/babel" src="console-screens2.jsx"></script>
  <script type="text/babel" src="console-app.jsx"></script>
</body>
