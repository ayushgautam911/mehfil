<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base ramp — xs 4 to xxxl 56" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    background: var(--surface-page);
    font-family: var(--font-sans);
    padding: var(--sp-xl);
    box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: var(--sp-lg); margin-bottom: var(--sp-sm); }
  .label { width: 110px; flex: none; font-size: var(--fs-xs); letter-spacing: var(--ls-wide); color: var(--text-secondary); text-transform: uppercase; }
  .bar { height: 12px; background: var(--accent-primary); box-shadow: var(--glow-green-sm); }
  .val { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-dim); }
</style>
</head>
<body>
  <div class="row"><span class="label">xs</span><span class="bar" style="width: 4px"></span><span class="val">4</span></div>
  <div class="row"><span class="label">sm</span><span class="bar" style="width: 8px"></span><span class="val">8</span></div>
  <div class="row"><span class="label">md</span><span class="bar" style="width: 12px"></span><span class="val">12</span></div>
  <div class="row"><span class="label">lg · gutter</span><span class="bar" style="width: 16px"></span><span class="val">16</span></div>
  <div class="row"><span class="label">xl</span><span class="bar" style="width: 24px"></span><span class="val">24</span></div>
  <div class="row"><span class="label">xxl</span><span class="bar" style="width: 36px"></span><span class="val">36</span></div>
  <div class="row"><span class="label">xxxl</span><span class="bar" style="width: 56px"></span><span class="val">56</span></div>
</body>
</html>
