<!-- @dsCard group="Type" viewport="700x220" name="Body & Readout" subtitle="Regular / medium, near-neutral tracking — content text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    background: var(--surface-page);
    font-family: var(--font-sans);
    padding: var(--sp-xl);
    box-sizing: border-box;
  }
  .row { display: flex; align-items: baseline; gap: var(--sp-lg); margin-bottom: var(--sp-md); }
  .meta { font-size: var(--fs-xs); letter-spacing: var(--ls-wide); color: var(--text-dim); width: 130px; flex: none; }
  .b-lg { font-size: var(--fs-lg); font-weight: var(--fw-medium); color: var(--text-primary); letter-spacing: var(--ls-normal); }
  .b-md { font-size: var(--fs-md); font-weight: var(--fw-regular); color: var(--text-primary); letter-spacing: var(--ls-normal); }
  .b-sm { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--text-secondary); letter-spacing: var(--ls-normal); }
</style>
</head>
<body>
  <div class="row"><span class="meta">16 · 500 · +1</span><span class="b-lg">Emphasis body — tier names, list leads</span></div>
  <div class="row"><span class="meta">14 · 400 · +1</span><span class="b-md">Default body. sat mar 22 · 23:00 · warehouse</span></div>
  <div class="row"><span class="meta">12 · 400 · +1</span><span class="b-sm">Secondary / supporting copy. address revealed 3hrs before</span></div>
</body>
</html>
