<!-- @dsCard group="Colors" viewport="700x200" name="Phosphor Accents" subtitle="Matrix green (primary) + cyan (secondary). Saturation lives only here" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    background: var(--surface-page);
    font-family: var(--font-sans);
    padding: var(--sp-xl);
    box-sizing: border-box;
    display: flex;
    gap: var(--sp-md);
  }
  .sw { flex: 1; }
  .chip { height: 96px; display: flex; align-items: flex-end; padding: var(--sp-sm); box-sizing: border-box; }
  .name { font-size: var(--fs-xs); letter-spacing: var(--ls-wide); color: var(--text-primary); text-transform: uppercase; margin-top: var(--sp-sm); }
  .hex { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 2px; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background: var(--hive-green); box-shadow: var(--glow-green-md)"></div><div class="name">Green — primary</div><div class="hex">#00ff41</div></div>
  <div class="sw"><div class="chip" style="background: var(--hive-cyan); box-shadow: var(--glow-cyan-sm)"></div><div class="name">Cyan — secondary</div><div class="hex">#0abdc6</div></div>
  <div class="sw"><div class="chip" style="background: var(--hive-green-bg); border: var(--border-accent)"><span style="color: var(--accent-primary); font-size: var(--fs-xs); letter-spacing: var(--ls-wide)">WASH 6%</span></div><div class="name">Green wash</div><div class="hex">rgba(0,255,65,.06)</div></div>
  <div class="sw"><div class="chip" style="background: transparent; border: 1px solid var(--hive-green-line)"><span style="color: var(--accent-primary); font-size: var(--fs-xs); letter-spacing: var(--ls-wide)">LINE 30%</span></div><div class="name">Glow line</div><div class="hex">rgba(0,255,65,.30)</div></div>
</body>
</html>
